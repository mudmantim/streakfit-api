; StreakFit pytest configuration.
;
; Why this file exists: `tests/conftest.py` does `from app import app`, but the
; repo root is not on sys.path when pytest is invoked as `pytest tests/`.
; pytest's prepend import mode inserts each test file's *basedir* (the first
; parent without an __init__.py — here `tests/`), NOT the rootdir. So the bare
; `pytest tests/` used by .github/workflows/ci.yml and `make test` failed with
; "ModuleNotFoundError: No module named 'app'", while `python -m pytest` worked
; only because that form implicitly prepends the cwd.
;
; `pythonpath = .` makes the repo root importable regardless of how pytest is
; launched, so CI, the Makefile, and an ad-hoc local run all behave identically.
;
; Deliberately pytest.ini and not pyproject.toml: Render's Python build detects
; a repo-root pyproject.toml and can switch off the requirements.txt install
; path. A tool-specific config file cannot affect the production build.

[pytest]
pythonpath = .
testpaths = tests
