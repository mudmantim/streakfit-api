# StreakFit — Render deployment, as code (Blueprint spec).
#
# ⚠️ STATUS: PROPOSED / RECONCILE BEFORE ADOPTING.
# The LIVE production service is currently configured in the Render dashboard, which is the
# real source of truth today. Committing this file does NOT change the running service —
# Render only applies a render.yaml when the service is created from / linked to a Blueprint.
# This file EXISTS so the deploy is reviewable and rebuildable from git; before making it
# authoritative, diff every field below against the live dashboard and confirm they match.
# See docs/operations/setup.md → "Production setup" and docs/operations/reproducibility.md.
#
# Two things to verify against the live dashboard specifically:
#   1. Port binding — RESOLVED 2026-07-25; the bare `gunicorn app:app` is CORRECT and needs no --bind.
#      Render sets $PORT (default 10000); gunicorn's documented default `bind` becomes `0.0.0.0:$PORT`
#      when PORT is in the environment (else 127.0.0.1:8000). Verified against gunicorn + Render docs
#      and empirically. So this startCommand (matching the live dashboard) binds correctly; do NOT add
#      --bind (optional explicitness only, no behavior change). See docs/operations/reproducibility.md.
#   2. Service plan / region / scaling (below are placeholders to confirm).

services:
  - type: web
    name: streakfit-api
    runtime: python
    region: ohio            # VERIFIED in the dashboard 2026-09-21
    plan: starter           # VERIFIED in the dashboard 2026-09-21 (paid; does NOT spin down)
    branch: main            # VERIFIED: auto-deploy On Commit
    # Python version comes from runtime.txt (python-3.12.7) — the single source of truth.
    # Not duplicated here to avoid drift.
    buildCommand: pip install -r requirements.txt
    # ⚠️ THE LIVE START COMMAND IS NOT THIS. Verified in the dashboard 2026-09-21:
    #
    #     flask db upgrade && STREAKFIT_ENFORCE_DB_HEAD=1 gunicorn app:app
    #
    # It does NOT set STREAKFIT_RETENTION_SWEEPER. Nothing sweeps and nothing
    # delivers on its own in production today. (It also does not matter yet:
    # the LIVE BUILD contains no sweeper at all — that arrives with this
    # branch.) Adding the flag is a deploy-time decision, not a code change.
    #
    # STREAKFIT_ENFORCE_DB_HEAD=1 is inline on gunicorn ONLY — as a global env
    # var the boot guard would fire during `flask db upgrade` and deadlock the
    # deploy. STREAKFIT_RETENTION_SWEEPER=1 must be inline for the same reason.
    #
    # RECOMMENDED CHANGE, requiring Tim's approval (see
    # docs/operations/notification-rollout.md §3): move `flask db upgrade` out
    # of the start command and into Render's Pre-Deploy Command, which is
    # currently empty. In the start command it re-runs on every process start
    # — restarts, scaling, crash recovery — where it is a no-op at best. As a
    # pre-deploy step it runs ONCE per deploy and a failure aborts the deploy
    # before the new version serves traffic, which is what "migrations are an
    # explicit deploy step" in CLAUDE.md actually asks for.
    #
    #   Pre-Deploy Command: flask db upgrade
    #   Start Command:      STREAKFIT_ENFORCE_DB_HEAD=1 STREAKFIT_RETENTION_SWEEPER=1 gunicorn app:app
    startCommand: flask db upgrade && STREAKFIT_ENFORCE_DB_HEAD=1 STREAKFIT_RETENTION_SWEEPER=1 gunicorn app:app
    healthCheckPath: /health
    envVars:
      # Secrets — set in the dashboard, never committed. `sync: false` = Render won't
      # manage/overwrite these from the blueprint; they're entered by an operator.
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_SECRET
        sync: false
      # ── Moderation alert delivery (Resend) ──────────────────────────────
      # All three are required together. With any one missing the channel
      # refuses to build, `_notification_channel()` returns None, and
      # `moderation.delivery_configured` FAILS naming the missing variable —
      # half-configured never reads as working.
      - key: STREAKFIT_NOTIFY_CHANNEL     # 'resend'
        sync: false
      - key: RESEND_API_KEY               # 🔒 generated by Tim in Resend
        sync: false
      - key: STREAKFIT_NOTIFY_FROM        # e.g. alerts@alerts.streakfit.pro
        sync: false
      - key: STREAKFIT_NOTIFY_TO          # the ONE address alerts go to
        sync: false
      # Builds the /admin link inside a notice. Unset → the message says "the
      # moderation queue" in words rather than guessing a host.
      - key: STREAKFIT_PUBLIC_URL         # https://streakfit.pro
        sync: false
      # ⚠️ ABSENT from the live service as of 2026-09-21. Without it NO photo
      # evidence is captured at all (fail-closed, deliberately) — a reviewer
      # sees `no_evidence_key` instead of an image. Set it before relying on
      # photo evidence in a real report.
      - key: STREAKFIT_EVIDENCE_KEY       # 🔒
        sync: false
      # Optional: uncomment and point at a Redis instance to make rate limits shared
      # across workers/instances instead of the per-worker `memory://` default.
      # - key: RATELIMIT_STORAGE_URI
      #   sync: false
    # Single worker today. Scaling out requires shared rate-limit storage + weather-cache
    # decision first — see docs/operations/production-readiness.md.

  # ══ CRON JOBS ══════════════════════════════════════════════════════════
  #
  # STATUS: NONE OF THESE EXIST YET. Render does not read this file for the
  # live service (it was created in the dashboard, not from a Blueprint), so
  # every block below is a specification to be typed into New Cron Job — not
  # something this file switches on.
  #
  # They also CANNOT be created before the deploy: `flask moderation-notify`,
  # `moderation-prune` and `coach-prune` do not exist in the live build
  # (fa92abd registers no CLI commands at all). A cron created today would
  # fail every run.
  #
  # WHY A CRON AT ALL, when the in-process worker does the same work:
  # the worker lives inside gunicorn. It is not running while the service is
  # deploying, restarting, crash-looping or scaled to zero, and a child-safety
  # report is on a 24-hour clock that does not pause for any of those. The
  # cron is the backstop, and it is the reason `source` distinguishes 'cron'
  # from 'thread': either satisfies monitoring, and a MANUAL run never does.
  #
  # RUNNING BOTH IS SAFE, and is asserted rather than assumed — see
  # tests/test_unattended_operation.py. Delivery takes a durable five-minute
  # lease (`moderation_notice.claimed_at`) committed before the send, so two
  # runners racing produce exactly one send; the loser skips. Retention
  # DELETEs are idempotent, and notice generation is uniqueness-constrained.
  #
  # COST: Render bills cron jobs by the second with a $1/month MINIMUM EACH.
  # Two jobs ≈ $2/month. One combined hourly job would be $1 but would couple
  # the two promises together — see the note on the retention job.

  # ── 1. Moderation alert delivery ───────────────────────────────────────
  #
  # HOURLY, because the promise is a 24-hour review window and a daily check
  # could burn a sixth of it before anybody is told. Generates notices and
  # attempts delivery in the same pass.
  #
  # `--scheduled` records the run as source='cron', which is what lets
  # `moderation.delivery_worker` report PASS. Passing it by hand would put a
  # lie in the record that nothing downstream can detect.
  #
  # NOT `--mark-delivered`: that flag claims a human was told, and a cron is
  # not a human. Delivery is recorded only against a provider receipt.
  - type: cron
    name: streakfit-moderation-notify
    runtime: python
    region: ohio            # must match the web service
    plan: starter
    branch: main
    schedule: "7 * * * *"   # hourly at :07, off the top-of-hour crowd
    buildCommand: pip install -r requirements.txt
    startCommand: flask moderation-notify --scheduled
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # The delivery channel needs the same four as the web service, or this
      # job runs, finds a queue, and can send none of it.
      - key: STREAKFIT_NOTIFY_CHANNEL
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: STREAKFIT_NOTIFY_FROM
        sync: false
      - key: STREAKFIT_NOTIFY_TO
        sync: false
      - key: STREAKFIT_PUBLIC_URL
        sync: false

  # ── 2. Retention sweeps ────────────────────────────────────────────────
  #
  # DAILY, because both windows are measured in days (30-day conversations,
  # 30-day evidence) and an hourly sweep would delete the same nothing 23
  # extra times.
  #
  # The two commands are chained with `&&` DELIBERATELY, and it is a real
  # trade-off: if the coach sweep fails, the evidence sweep does not run that
  # day, and the job exits non-zero so the failure is visible. The
  # alternative — two separate cron jobs — keeps the promises independent the
  # way the in-process worker does (each in its own try block) at the cost of
  # another $1/month. Split them if evidence retention ever needs to be
  # provably independent of conversation retention; until then the in-process
  # worker already sweeps both hourly and this is the backstop for the hours
  # it is not running.
  - type: cron
    name: streakfit-retention-sweep
    runtime: python
    region: ohio
    plan: starter
    branch: main
    schedule: "17 3 * * *"  # 03:17 UTC, an odd minute on purpose
    buildCommand: pip install -r requirements.txt
    startCommand: flask coach-prune --scheduled && flask moderation-prune --scheduled
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SECRET_KEY
        sync: false
      - key: JWT_SECRET_KEY
        sync: false
      # Required to purge PHOTO evidence. The sweep deletes ciphertext without
      # reading it, but a DIFFERENT key here than the web service would leave
      # photos undecryptable; the same key must be used in both places.
      - key: STREAKFIT_EVIDENCE_KEY
        sync: false
