name: CI

# Runs the test suite on the SAME Python + pinned dependency set that production uses
# (runtime.txt = 3.12.7), so CI validates the real deployed stack — not a dev machine's.
# CI does not touch production; it only gates correctness before a merge/deploy.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The workflow only reads the repository. Without this the job token gets the
# repository's default permissions, which may include write.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      # Dummy values only — the app requires these at import; tests use a temp SQLite DB.
      SECRET_KEY: ci-secret-not-for-production
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 on 2026-10-12

      - name: Set up Python 3.12.7 (matches runtime.txt)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 on 2026-10-12
        with:
          python-version: '3.12.7'
          cache: pip

      - name: Assert every runtime dependency is pinned (==)
        run: |
          unpinned=$(grep -vE '^\s*#|^\s*$' requirements.txt | grep -vE '==' || true)
          if [ -n "$unpinned" ]; then
            echo "::error::Unpinned dependency in requirements.txt — every line must use '==':"
            echo "$unpinned"
            exit 1
          fi
          echo "all runtime dependencies are pinned"

      - name: Install dependencies (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff — see ruff.toml for the enabled set and exclusions)
        run: ruff check .

      - name: Type-check (mypy — see mypy.ini for scope)
        run: mypy

      # No bundler means nothing else would catch a renamed icon or a typo'd
      # asset path before a user sees a broken image. This is that gate.
      - name: Production build gate (asset refs, service worker, JS syntax, app import)
        run: python scripts/build_check.py

      - name: Run test suite (SQLite; incl. migration-chain integrity — PostgreSQL tests run in the postgres job)
        run: pytest tests/ -q

      - name: Verification suite is import-clean (stdlib-only smoke)
        run: python -c "import scripts.verify_all"

  # Both secret scanners over the FULL history of every branch and tag: the
  # repository is public, so a credential in any old commit is already
  # published. The `test` job's scan only sees the current files.
  #
  # Gitleaks is a second, independently maintained rule set alongside our own
  # scanner (scripts/secret_scan.py), which only knows StreakFit's credential
  # shapes. It is a pinned release binary, NOT a third-party action: the
  # tarball's SHA-256 is fixed below (it matches both the release's
  # checksums.txt and GitHub's recorded asset digest, checked 2026-10-13), and
  # nothing runs unless it matches. Findings are printed redacted. See
  # docs/operations/secret-scanning.md for upgrading it and triaging findings.
  secret-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 on 2026-10-12
        with:
          fetch-depth: 0          # every commit of every branch and tag
          persist-credentials: false

      - name: StreakFit scanner over all history
        run: python3 scripts/secret_scan.py --history

      - name: Install Gitleaks (pinned version, checksum verified before use)
        if: ${{ !cancelled() }}   # run even when our scanner failed: two independent answers
        run: |
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          tarball="$dir/gitleaks.tar.gz"
          curl -fsSL --proto '=https' --tlsv1.2 -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $tarball" | sha256sum --check --strict
          tar -xzf "$tarball" -C "$dir" gitleaks
          "$dir/gitleaks" version
          echo "$dir" >> "$GITHUB_PATH"

      - name: Gitleaks over all history (redacted)
        if: ${{ !cancelled() }}   # run even when our scanner failed: two independent answers
        run: gitleaks git --log-opts="--all" --redact --no-banner --verbose --exit-code 1 .

  # The PostgreSQL-only tests: the concurrency and locking scenarios, account
  # deletion against real foreign keys, the daily-mission races, and the
  # migration chain on the dialect production runs. Without a database the
  # `test` job above skips all of them (41 of its "skipped" were exactly these).
  #
  # Separate job so the SQLite suite's signal and runtime are unchanged, and a
  # database problem cannot hide behind it. It never sees a real secret: the
  # database is a throwaway service container on the runner.
  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        # PostgreSQL 17.10, production's major version (restore rehearsals use
        # 17). Pinned by the multi-platform index digest that the local runs of
        # these tests used (2026-10-12), so a rebuilt tag cannot change it.
        image: postgres:17.10@sha256:5f050f770b427fbd477edee6c3968a72e5c6be97e050a7e368b2b74a9494a285
        env:
          POSTGRES_PASSWORD: ci-postgres-not-a-secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      SECRET_KEY: ci-secret-not-for-production
      JWT_SECRET_KEY: ci-jwt-secret-not-for-production
      PG_SERVER: postgresql://postgres:ci-postgres-not-a-secret@127.0.0.1:5432
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4 on 2026-10-12

      - name: Set up Python 3.12.7 (matches runtime.txt)
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5 on 2026-10-12
        with:
          python-version: '3.12.7'
          cache: pip

      - name: Install dependencies (base + dev)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # Two files migrate the database they are given IN PLACE and assert it
      # starts empty (test_concurrency_postgres, test_account_deletion_postgres),
      # so they cannot share one. The others create and drop scratch databases
      # of their own and only need the server.
      - name: Create one empty database per in-place suite
        run: |
          python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          eng = create_engine(os.environ['PG_SERVER'] + '/postgres', isolation_level='AUTOCOMMIT')
          with eng.connect() as c:
              for name in ('sf_concurrency', 'sf_deletion'):
                  c.execute(text(f'CREATE DATABASE "{name}"'))
          PY

      # Every invocation must run all of its tests: a skip here means the
      # database was not reached, which is the failure this job exists to catch.
      - name: PostgreSQL tests (no skips allowed)
        run: |
          run() {  # <database> <test files...>
            db="$1"; shift
            STREAKFIT_TEST_POSTGRES_URL="$PG_SERVER/$db" \
              python -m pytest -q -rs -p no:cacheprovider "$@" 2>&1 | tee pytest.out
            status=${PIPESTATUS[0]}
            if grep -qE '[0-9]+ skipped' pytest.out; then
              echo "::error::PostgreSQL tests were skipped -- the database was not used"
              exit 1
            fi
            [ "$status" -eq 0 ] || exit "$status"
          }
          run sf_concurrency tests/test_concurrency_postgres.py
          run sf_deletion    tests/test_account_deletion_postgres.py
          run postgres       tests/test_daily_mission_postgres.py tests/test_migrations_postgres.py
