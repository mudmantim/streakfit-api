# StreakFit type-check configuration.
#
# Scope is honest and deliberately narrow: the codebase is not annotated, so
# this is NOT a full static-typing adoption. What it does buy is a real gate on
# the failure modes that bite an untyped Flask app — undefined names, bad
# attribute access on known types, and unannotated mutable module-level state
# that silently becomes dict[Any, Any].
#
# Run:  make typecheck
#
# In mypy.ini rather than pyproject.toml on purpose: Render's Python build
# inspects a repo-root pyproject.toml and can bypass the requirements.txt
# install path. A tool-specific config file cannot affect the production build.

[mypy]
python_version = 3.12
files = app.py
ignore_missing_imports = True
warn_unused_ignores = True
# Not enabled (would need the codebase annotated first, which is a separate
# piece of work): disallow_untyped_defs, disallow_incomplete_defs, strict.

# Flask-SQLAlchemy declares models as `class Foo(db.Model)`. mypy cannot use an
# *attribute expression* as a base class, so every model definition reports
# `Name "db.Model" is not defined` — 15 findings that say nothing about the
# code. This is a known Flask-SQLAlchemy/mypy interaction, not a defect; the
# real alternative (migrating all 15 models to a DeclarativeBase subclass) is a
# schema-adjacent change and does not belong in a lint pass.
[mypy-app]
disable_error_code = name-defined
